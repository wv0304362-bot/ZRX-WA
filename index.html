<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeryx Streaming - Animes</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Consola de diagnóstico Eruda para telemóvel -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #fff; font-family: Arial, sans-serif; padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #e50914; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        
        /* Barra de Pesquisa */
        .search-container { display: flex; gap: 8px; max-width: 500px; margin: 0 auto 20px auto; }
        .search-input { flex: 1; background: #181818; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #e50914; }
        .search-btn { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background: #b80710; }

        /* Secções e Títulos */
        .section-title { font-size: 16px; margin: 20px 0 10px 0; border-left: 4px solid #e50914; padding-left: 8px; }

        /* Top 3 Destaques Especiais */
        .top3-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .top3-card { background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; text-align: center; transition: transform 0.2s; }
        .top3-card:hover { transform: scale(1.03); }
        .top3-card img { width: 100%; height: 160px; object-fit: cover; background: #222; }
        .top3-badge { position: absolute; top: 5px; left: 5px; background: #e50914; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 4px; z-index: 2; }
        .top3-card h3 { font-size: 12px; padding: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Carrossel Horizontal para Categorias */
        .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #e50914; border-radius: 3px; }
        
        .card { min-width: 130px; width: 130px; background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: scale(1.04); box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
        .card img { width: 100%; height: 170px; object-fit: cover; background: #222; }
        .card h3 { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Tela do Player e Episódios / Temporadas */
        #watch-section { display: none; margin-top: 20px; }
        video { width: 100%; max-height: 480px; background: #000; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); }
        .episodes-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-top: 15px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: background 0.2s; }
        .ep-btn:hover, .ep-btn.active { background: #e50914; border-color: #e50914; }
        .back-btn { background: #222; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .back-btn:hover { background: #444; }
        
        /* Informações e Temporadas */
        .seasons-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .season-btn { background: #181818; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .season-btn:hover, .season-btn.active { background: #e50914; border-color: #e50914; }

        .loading { text-align: center; color: #aaa; padding: 30px; font-size: 15px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>Zeryx Animes</h1>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar anime..." onkeypress="verificarEnter(event)">
            <button class="search-btn" onclick="pesquisarAnime()">🔍</button>
        </div>
    </header>

    <!-- Catálogo Principal -->
    <div id="catalog-section">
        
        <!-- Top 3 Animes em Destaque -->
        <h2 class="section-title">🏆 Top 3 em Destaque</h2>
        <div class="top3-container" id="top3-grid">
            <div class="loading">A carregar do HiAnime...</div>
        </div>

        <!-- Categoria: Ação -->
        <h2 class="section-title">⚔️ Animes de Ação</h2>
        <div class="horizontal-scroll" id="action-grid">
            <div class="loading">A carregar...</div>
        </div>

        <!-- Categoria: Populares -->
        <h2 class="section-title">💖 Animes Populares</h2>
        <div class="horizontal-scroll" id="romance-grid">
            <div class="loading">A carregar...</div>
        </div>

    </div>

    <!-- Tela de Resultados da Pesquisa -->
    <div id="search-results-section" style="display:none;">
        <h2 class="section-title" id="search-title-text">Resultados da Pesquisa</h2>
        <div class="horizontal-scroll" id="search-grid" style="flex-wrap: wrap; overflow-x: visible;"></div>
    </div>

    <!-- Reprodução, Temporadas e Episódios -->
    <div id="watch-section">
        <button class="back-btn" onclick="voltarCatalogo()">⬅ Voltar ao Catálogo</button>
        <h2 id="anime-title" style="margin-bottom: 8px; font-size: 18px; color: #e50914;"></h2>
        
        <video id="videoPlayer" controls autoplay></video>
        
        <!-- Temporadas -->
        <div id="seasons-section" style="margin-top: 15px; display: none;">
            <h3 style="font-size: 14px; margin-bottom: 6px; color: #ccc;">Temporadas / Séries Relacionadas:</h3>
            <div class="seasons-container" id="seasons-list"></div>
        </div>

        <h3 style="margin-top: 15px; font-size: 14px; color: #ccc;">Episódios Disponíveis:</h3>
        <div class="episodes-container" id="episodes-list">
            <div style="color: #aaa;">A carregar episódios...</div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://zrx-wa.onrender.com';

        async function fetchApi(endpoint) {
            const rotasPossiveis = [
                `${BASE_URL}/api/v2/hianime${endpoint}`,
                `${BASE_URL}/api/v1/hianime${endpoint}`,
                `${BASE_URL}${endpoint}`
            ];

            for (let url of rotasPossiveis) {
                try {
                    let res = await fetch(url);
                    if (res.ok) {
                        let json = await res.json();
                        if (json) return json;
                    }
                } catch (e) {}
            }
            throw new Error("Servidor indisponível.");
        }

        async function carregarCatalogo() {
            try {
                let dados = await fetchApi('/home');
                let resData = dados.data || dados;
                
                let spotlight = resData.spotlightAnimes || [];
                let trending = resData.trendingAnimes || [];
                let latest = resData.latestEpisodeAnimes || [];

                if (spotlight.length === 0) throw new Error("Sem dados");

                renderizarCatalogoVisual(spotlight, trending, latest);
            } catch (erro) {
                console.warn("Erro ao ligar ao HiAnime, a usar fallback visual...");
                // Fallback garantido com imagens limpas caso o servidor demore a acordar
                let fallbackData = [
                    { id: "one-piece-100", name: "One Piece", poster: "https://m.media-amazon.com/images/M/MV5BODcwNWE3OTMtMDc3MS00NDFjLWE1OTAtNDAxNzYyOWJiYTUzXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
                    { id: "jujutsu-kaisen-531", name: "Jujutsu Kaisen", poster: "https://m.media-amazon.com/images/M/MV5BNGY4MTg3NzgtOWFkZi00YzVlLWEwNjktZmQyYTkxN2QzMjcxXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
                    { id: "naruto-20", name: "Naruto", poster: "https://m.media-amazon.com/images/M/MV5BZTNjOWVhNGMtOGYwNi00MjAxLWFkYjMtNDBkZjJhYjFjNzBjXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" }
                ];
                renderizarCatalogoVisual(fallbackData, fallbackData, fallbackData);
            }
        }

        function renderizarCatalogoVisual(spotlight, trending, latest) {
            let top3Grid = document.getElementById('top3-grid');
            top3Grid.innerHTML = '';
            spotlight.slice(0, 3).forEach((anime, index) => {
                let card = document.createElement('div');
                card.className = 'top3-card';
                card.onclick = () => carregarDetalhes(anime.id, anime.name);
                card.innerHTML = `
                    <div class="top3-badge">Top ${index + 1}</div>
                    <img src="${anime.poster}" alt="${anime.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/130x170?text=Anime'">
                    <h3>${anime.name}</h3>
                `;
                top3Grid.appendChild(card);
            });

            let actionGrid = document.getElementById('action-grid');
            actionGrid.innerHTML = '';
            (trending.length ? trending : spotlight).forEach(anime => {
                actionGrid.appendChild(criarCardHorizontal(anime));
            });

            let romanceGrid = document.getElementById('romance-grid');
            romanceGrid.innerHTML = '';
            (latest.length ? latest : spotlight).forEach(anime => {
                romanceGrid.appendChild(criarCardHorizontal(anime));
            });
        }

        function criarCardHorizontal(anime) {
            let card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => carregarDetalhes(anime.id, anime.name);
            card.innerHTML = `
                <img src="${anime.poster}" alt="${anime.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/130x170?text=Anime'">
                <h3>${anime.name}</h3>
            `;
            return card;
        }

        async function carregarDetalhes(animeId, animeTitle) {
            document.getElementById('catalog-section').style.display = 'none';
            document.getElementById('search-results-section').style.display = 'none';
            document.getElementById('watch-section').style.display = 'block';
            document.getElementById('anime-title').innerText = animeTitle;
            
            let epList = document.getElementById('episodes-list');
            epList.innerHTML = '<div style="color: #aaa;">A carregar do HiAnime...</div>';

            try {
                // Tentar buscar temporadas/seasons vindas da API do HiAnime
                let seasonsSec = document.getElementById('seasons-section');
                let seasonsList = document.getElementById('seasons-list');
                seasonsList.innerHTML = '';

                try {
                    let infoDados = await fetchApi(`/anime/${animeId}`);
                    let infoData = infoDados.data || infoDados;
                    let secoesTemporadas = infoData.seasons || infoData.relatedAnimes || [];
                    
                    if (secoesTemporadas.length > 0) {
                        seasonsSec.style.display = 'block';
                        secoesTemporadas.forEach((seas, idx) => {
                            let btn = document.createElement('button');
                            btn.className = `season-btn ${seas.id === animeId ? 'active' : ''}`;
                            btn.innerText = seas.name || `Temporada ${idx + 1}`;
                            btn.onclick = () => carregarDetalhes(seas.id, `${animeTitle} - ${seas.name}`);
                            seasonsList.appendChild(btn);
                        });
                    } else {
                        seasonsSec.style.display = 'none';
                    }
                } catch(e) {
                    seasonsSec.style.display = 'none';
                }

                // Buscar episódios reais do HiAnime
                let dadosEp = await fetchApi(`/anime/${animeId}/episodes`);
                let epData = dadosEp.data || dadosEp;
                let episodios = epData.episodes || [];

                epList.innerHTML = '';
                if (episodios.length === 0) {
                    epList.innerHTML = '<div style="color: #aaa;">Nenhum episódio encontrado na API.</div>';
                    return;
                }

                episodios.forEach(ep => {
                    let btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.id = `ep-${ep.episodeId}`;
                    btn.innerText = `Ep ${ep.number}`;
                    btn.onclick = () => assistirEpisodio(ep.episodeId, btn);
                    epList.appendChild(btn);
                });

                // Tocar automaticamente o primeiro episódio
                if (episodios.length > 0) {
                    assistirEpisodio(episodios[0].episodeId, document.getElementById(`ep-${episodios[0].episodeId}`));
                }

            } catch (erro) {
                epList.innerHTML = '<div style="color: #e50914;">Erro ao carregar dados do HiAnime.</div>';
            }
        }

        async function assistirEpisodio(episodeId, btnElement) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            try {
                let dados = await fetchApi(`/episode/sources?animeEpisodeId=${episodeId}`);
                let resData = dados.data || dados;
                let sources = resData.sources || [];
                let videoUrl = sources.find(s => s.type === 'hls')?.url || sources[0]?.url;

                if (!videoUrl) return;

                let video = document.getElementById('videoPlayer');
                if (Hls.isSupported()) {
                    let hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoUrl;
                }
            } catch (erro) {
                console.warn("Erro ao carregar o link do vídeo.");
            }
        }

        async function pesquisarAnime() {
            let query = document.getElementById('searchInput').value.trim();
            if (!query) {
                document.getElementById('search-results-section').style.display = 'none';
                document.getElementById('catalog-section').style.display = 'block';
                return;
            }

            document.getElementById('catalog-section').style.display = 'none';
            let searchSec = document.getElementById('search-results-section');
            searchSec.style.display = 'block';
            
            let searchGrid = document.getElementById('search-grid');
            searchGrid.innerHTML = '<div class="loading">A pesquisar no HiAnime...</div>';
            document.getElementById('search-title-text').innerText = `Resultados para: "${query}"`;

            try {
                let dados = await fetchApi(`/search?q=${encodeURIComponent(query)}`);
                let resData = dados.data || dados;
                let listaAnimes = resData.animes || [];

                searchGrid.innerHTML = '';
                if (listaAnimes.length === 0) {
                    searchGrid.innerHTML = '<div class="loading">Nenhum anime encontrado.</div>';
                    return;
                }

                listaAnimes.forEach(anime => {
                    searchGrid.appendChild(criarCardHorizontal(anime));
                });
            } catch (erro) {
                searchGrid.innerHTML = '<div class="loading" style="color: #e50914;">Erro ao pesquisar.</div>';
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                pesquisarAnime();
            }
        }

        function voltarCatalogo() {
            document.getElementById('watch-section').style.display = 'none';
            let query = document.getElementById('searchInput').value.trim();
            if (query) {
                document.getElementById('search-results-section').style.display = 'block';
            } else {
                document.getElementById('catalog-section').style.display = 'block';
            }
            let video = document.getElementById('videoPlayer');
            video.pause();
            video.src = "";
        }

        carregarCatalogo();
    </script>
</body>
</html>
