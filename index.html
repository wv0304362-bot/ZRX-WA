<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeryx Streaming - Animes</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Consola de diagnóstico Eruda para telemóvel -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #fff; font-family: Arial, sans-serif; padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #e50914; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        
        /* Barra de Pesquisa */
        .search-container { display: flex; gap: 8px; max-width: 500px; margin: 0 auto 20px auto; }
        .search-input { flex: 1; background: #181818; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #e50914; }
        .search-btn { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background: #b80710; }

        /* Grid de Animes */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
        .card { background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: scale(1.04); box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
        .card img { width: 100%; height: 190px; object-fit: cover; }
        .card h3 { font-size: 13px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Tela do Player e Episódios */
        #watch-section { display: none; margin-top: 20px; }
        video { width: 100%; max-height: 480px; background: #000; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); }
        .episodes-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-top: 15px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: background 0.2s; }
        .ep-btn:hover, .ep-btn.active { background: #e50914; border-color: #e50914; }
        .back-btn { background: #222; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .back-btn:hover { background: #444; }
        .loading { text-align: center; color: #aaa; grid-column: 1 / -1; padding: 30px; font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Zeryx Animes</h1>
        <!-- Nova Operação: Barra de Pesquisa -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar anime..." onkeypress="verificarEnter(event)">
            <button class="search-btn" onclick="pesquisarAnime()">🔍</button>
        </div>
    </header>

    <!-- Catálogo -->
    <div id="catalog-section">
        <h2 id="section-title" style="font-size: 16px; margin-bottom: 12px; border-left: 4px solid #e50914; padding-left: 8px;">Animes em Destaque</h2>
        <div class="grid" id="anime-grid">
            <div class="loading">A carregar catálogo do servidor (o Render pode demorar até 40s a acordar)...</div>
        </div>
    </div>

    <!-- Reprodução -->
    <div id="watch-section">
        <button class="back-btn" onclick="voltarCatalogo()">⬅ Voltar ao Catálogo</button>
        <h2 id="anime-title" style="margin-bottom: 12px; font-size: 18px; color: #e50914;"></h2>
        
        <video id="videoPlayer" controls autoplay></video>
        
        <h3 style="margin-top: 20px; font-size: 15px;">Episódios Disponíveis:</h3>
        <div class="episodes-container" id="episodes-list">
            <div style="color: #aaa;">A carregar episódios...</div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://zrx-wa.onrender.com';

        // Sistema inteligente de rotas para evitar 404
        async function fetchApi(endpoint) {
            const rotasPossiveis = [
                `${BASE_URL}/api/v2/hianime${endpoint}`,
                `${BASE_URL}/api/v1/hianime${endpoint}`,
                `${BASE_URL}${endpoint}`
            ];

            for (let url of rotasPossiveis) {
                try {
                    let res = await fetch(url);
                    if (res.ok) {
                        let json = await res.json();
                        if (json && (json.success !== false || json.data)) {
                            return json;
                        }
                    }
                } catch (e) {
                    console.warn("Tentativa falhou para:", url);
                }
            }
            throw new Error("Todas as rotas da API falharam.");
        }

        async function carregarCatalogo() {
            try {
                let dados = await fetchApi('/home');
                document.getElementById('section-title').innerText = "Animes em Destaque";
                
                let grid = document.getElementById('anime-grid');
                grid.innerHTML = '';

                let listaAnimes = dados.data?.spotlightAnimes || dados.data?.trendingAnimes || dados.spotlightAnimes || [];

                if (listaAnimes.length === 0) {
                    grid.innerHTML = '<div class="loading">Nenhum anime encontrado de momento.</div>';
                    return;
                }

                renderizarGrid(listaAnimes);
            } catch (erro) {
                console.error("Erro ao carregar catálogo:", erro);
                document.getElementById('anime-grid').innerHTML = `
                    <div class="loading" style="color: #e50914;">
                        Erro ao conectar com o Render.<br>
                        <small style="color: #bbb;">Verifique a consola flutuante (Eruda) para mais detalhes.</small>
                    </div>`;
            }
        }

        // Nova Operação: Função de Pesquisa
        async function pesquisarAnime() {
            let query = document.getElementById('searchInput').value.trim();
            if (!query) {
                carregarCatalogo();
                return;
            }

            let grid = document.getElementById('anime-grid');
            grid.innerHTML = '<div class="loading">A pesquisar animes...</div>';
            document.getElementById('section-title').innerText = `Resultados para: "${query}"`;

            try {
                let dados = await fetchApi(`/search?q=${encodeURIComponent(query)}`);
                let listaAnimes = dados.data?.animes || dados.animes || [];

                if (listaAnimes.length === 0) {
                    grid.innerHTML = '<div class="loading">Nenhum anime encontrado com esse nome.</div>';
                    return;
                }

                renderizarGrid(listaAnimes);
            } catch (erro) {
                console.error("Erro na pesquisa:", erro);
                grid.innerHTML = '<div class="loading" style="color: #e50914;">Erro ao realizar a pesquisa.</div>';
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                pesquisarAnime();
            }
        }

        function renderizarGrid(listaAnimes) {
            let grid = document.getElementById('anime-grid');
            grid.innerHTML = '';

            listaAnimes.forEach(anime => {
                let card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => carregarDetalhes(anime.id, anime.name);
                card.innerHTML = `
                    <img src="${anime.poster}" alt="${anime.name}" loading="lazy">
                    <h3>${anime.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        async function carregarDetalhes(animeId, animeTitle) {
            document.getElementById('catalog-section').style.display = 'none';
            document.getElementById('watch-section').style.display = 'block';
            document.getElementById('anime-title').innerText = animeTitle;
            
            let epList = document.getElementById('episodes-list');
            epList.innerHTML = '<div style="color: #aaa;">A carregar lista de episódios...</div>';

            try {
                let dados = await fetchApi(`/anime/${animeId}/episodes`);

                epList.innerHTML = '';
                let episodios = dados.data?.episodes || dados.episodes || [];

                if (episodios.length === 0) {
                    epList.innerHTML = '<div style="color: #e50914;">Nenhum episódio encontrado.</div>';
                    return;
                }

                episodios.forEach(ep => {
                    let btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.id = `ep-${ep.episodeId}`;
                    btn.innerText = `Ep ${ep.number}`;
                    btn.onclick = () => assistirEpisodio(ep.episodeId, btn);
                    epList.appendChild(btn);
                });

                if(episodios.length > 0) {
                    assistirEpisodio(episodios[0].episodeId, document.getElementById(`ep-${episodios[0].episodeId}`));
                }
            } catch (erro) {
                console.error("Erro ao carregar episódios:", erro);
                epList.innerHTML = '<div style="color: #e50914;">Erro ao carregar os episódios.</div>';
            }
        }

        async function assistirEpisodio(episodeId, btnElement) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            try {
                let dados = await fetchApi(`/episode/sources?animeEpisodeId=${episodeId}`);

                let sources = dados.data?.sources || dados.sources || [];
                let videoUrl = sources.find(s => s.type === 'hls')?.url || sources[0]?.url;

                if (!videoUrl) {
                    alert("Link de vídeo indisponível para este episódio.");
                    return;
                }

                let video = document.getElementById('videoPlayer');

                if (Hls.isSupported()) {
                    let hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoUrl;
                }
            } catch (erro) {
                console.error("Erro ao carregar o vídeo:", erro);
                alert("Erro ao carregar a fonte de vídeo.");
            }
        }

        function voltarCatalogo() {
            document.getElementById('watch-section').style.display = 'none';
            document.getElementById('catalog-section').style.display = 'block';
            let video = document.getElementById('videoPlayer');
            video.pause();
            video.src = "";
        }

        carregarCatalogo();
    </script>
</body>
</html>
