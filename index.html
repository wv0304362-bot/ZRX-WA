<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeryx Animes - Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Consola de diagnóstico Eruda para telemóvel -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #fff; font-family: Arial, sans-serif; padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #e50914; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        
        .search-container { display: flex; gap: 8px; max-width: 500px; margin: 0 auto 20px auto; }
        .search-input { flex: 1; background: #181818; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #e50914; }
        .search-btn { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background: #b80710; }

        .category-section { margin-bottom: 25px; }
        .section-title { font-size: 15px; margin-bottom: 10px; border-left: 4px solid #e50914; padding-left: 8px; text-transform: uppercase; }

        .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #e50914; border-radius: 3px; }
        
        .card { min-width: 130px; width: 130px; background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: scale(1.04); box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
        .card img { width: 100%; height: 170px; object-fit: cover; background: #222; display: block; }
        .card h3 { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #watch-section { display: none; margin-top: 20px; }
        video { width: 100%; max-height: 480px; background: #000; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); }
        .episodes-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-top: 15px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: background 0.2s; }
        .ep-btn:hover, .ep-btn.active { background: #e50914; border-color: #e50914; }
        .back-btn { background: #222; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .back-btn:hover { background: #444; }

        .loading { text-align: center; color: #aaa; padding: 30px; font-size: 15px; width: 100%; }
        .server-status { background: #220000; border: 1px solid #e50914; color: #ff8888; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Zeryx Animes</h1>
        <div id="serverStatus" class="server-status">A ligar ao servidor Render...</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar anime..." onkeypress="verificarEnter(event)">
            <button class="search-btn" onclick="pesquisarAnime()">🔍</button>
        </div>
    </header>

    <div id="catalog-section">
        <div id="categories-container">
            <div class="loading">A carregar categorias de animes...</div>
        </div>
    </div>

    <div id="search-results-section" style="display:none;">
        <h2 class="section-title" id="search-title-text">Resultados da Pesquisa</h2>
        <div class="horizontal-scroll" id="search-grid" style="flex-wrap: wrap; overflow-x: visible;"></div>
    </div>

    <div id="watch-section">
        <button class="back-btn" onclick="voltarCatalogo()">⬅ Voltar ao Catálogo</button>
        <h2 id="anime-title" style="margin-bottom: 8px; font-size: 18px; color: #e50914;"></h2>
        
        <video id="videoPlayer" controls autoplay playsinline></video>

        <h3 style="margin-top: 15px; font-size: 14px; color: #ccc;">Episódios:</h3>
        <div class="episodes-container" id="episodes-list"><div class="loading">A carregar episódios...</div></div>
    </div>

    <script>
        const API_URL = "https://zrx-wa.onrender.com/api/v2";

        async function carregarHome() {
            let container = document.getElementById('categories-container');
            let statusBox = document.getElementById('serverStatus');
            statusBox.style.display = 'block';

            let dados = null;
            try {
                let resposta = await fetch(`${API_URL}/home`);
                if (resposta.ok) {
                    let json = await resposta.json();
                    dados = json.data || json;
                } else {
                    console.error("Erro HTTP:", resposta.status);
                }
            } catch (e) {
                console.error("Erro de rede ao carregar home:", e);
            }

            statusBox.style.display = 'none';

            if (!dados) {
                container.innerHTML = '<div class="loading">Erro: Não foi possível obter dados da rota `/api/v2/home`. Verifique o CORS ou se o servidor no Render acordou.</div>';
                return;
            }

            container.innerHTML = '';

            const categoriasMapeadas = [
                { key: 'spotlightAnimes', title: '⭐ Destaques (Spotlight)' },
                { key: 'trendingAnimes', title: '🔥 Animes em Alta (Trending)' },
                { key: 'latestEpisodeAnimes', title: '⚡ Últimos Episódios Atualizados' },
                { key: 'topAiringAnimes', title: '🏆 Mais Assistidos / No Air' },
                { key: 'topUpcomingAnimes', title: '📅 Próximos Lançamentos' }
            ];

            let encontrouAlguma = false;

            categoriasMapeadas.forEach(cat => {
                let listaAnimes = dados[cat.key];
                if (listaAnimes && Array.isArray(listaAnimes) && listaAnimes.length > 0) {
                    encontrouAlguma = true;
                    criarSecaoCarrossel(container, cat.title, listaAnimes);
                }
            });

            if (!encontrouAlguma && Array.isArray(dados)) {
                criarSecaoCarrossel(container, '🔥 Todos os Animes', dados);
            } else if (!encontrouAlguma) {
                for (let chave in dados) {
                    if (Array.isArray(dados[chave]) && dados[chave].length > 0) {
                        criarSecaoCarrossel(container, chave.toUpperCase(), dados[chave]);
                    }
                }
            }
        }

        function criarSecaoCarrossel(pai, titulo, animes) {
            let section = document.createElement('div');
            section.className = 'category-section';

            let h2 = document.createElement('h2');
            h2.className = 'section-title';
            h2.innerText = titulo;
            section.appendChild(h2);

            let scrollDiv = document.createElement('div');
            scrollDiv.className = 'horizontal-scroll';

            animes.forEach(anime => {
                let card = document.createElement('div');
                card.className = 'card';
                let animeId = anime.id || anime.animeId;
                let animeTitle = anime.name || anime.title;
                let animePoster = anime.poster || anime.image || anime.img;

                card.onclick = () => abrirAnime(animeId, animeTitle);
                card.innerHTML = `
                    <img src="${animePoster}" alt="${animeTitle}" loading="lazy" onerror="this.src='https://via.placeholder.com/130x170/222/fff?text=Zeryx'">
                    <h3>${animeTitle}</h3>
                `;
                scrollDiv.appendChild(card);
            });

            section.appendChild(scrollDiv);
            pai.appendChild(section);
        }

        async function pesquisarAnime() {
            let query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('catalog-section').style.display = 'none';
            let searchSec = document.getElementById('search-results-section');
            searchSec.style.display = 'block';
            let searchGrid = document.getElementById('search-grid');
            searchGrid.innerHTML = '<div class="loading">A pesquisar...</div>';
            
            document.getElementById('search-title-text').innerText = `Resultados para: "${query}"`;

            try {
                let resposta = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
                let dados = await resposta.json();
                let lista = dados.data?.animes || dados.data || dados.results || dados;

                searchGrid.innerHTML = '';
                if (!lista || lista.length === 0) {
                    searchGrid.innerHTML = '<div class="loading">Nenhum anime encontrado.</div>';
                    return;
                }

                lista.forEach(anime => {
                    let card = document.createElement('div');
                    card.className = 'card';
                    let animeId = anime.id || anime.animeId;
                    let animeTitle = anime.name || anime.title;
                    let animePoster = anime.poster || anime.image;

                    card.onclick = () => abrirAnime(animeId, animeTitle);
                    card.innerHTML = `
                        <img src="${animePoster}" alt="${animeTitle}" loading="lazy" onerror="this.src='https://via.placeholder.com/130x170/222/fff?text=Zeryx'">
                        <h3>${animeTitle}</h3>
                    `;
                    searchGrid.appendChild(card);
                });
            } catch (e) {
                searchGrid.innerHTML = '<div class="loading">Erro na pesquisa.</div>';
            }
        }

        async function abrirAnime(animeId, animeName) {
            document.getElementById('catalog-section').style.display = 'none';
            document.getElementById('search-results-section').style.display = 'none';
            document.getElementById('watch-section').style.display = 'block';
            document.getElementById('anime-title').innerText = animeName || "Anime";

            let epList = document.getElementById('episodes-list');
            epList.innerHTML = '<div class="loading">A carregar episódios...</div>';

            try {
                // Extrai apenas o ID numérico final caso venha no formato "nome-id"
                let idLimpo = animeId;
                if (typeof animeId === 'string' && animeId.includes('-')) {
                    let partes = animeId.split('-');
                    let possivelId = partes[partes.length - 1];
                    if (!isNaN(possivelId)) {
                        idLimpo = possivelId;
                    }
                }

                let resposta = await fetch(`${API_URL}/episodes/${idLimpo}`);
                let json = await resposta.json();
                
                console.log("RESPOSTA COMPLETA DO BACKEND (/episodes):", json);

                let episodios = [];
                if (Array.isArray(json)) {
                    episodios = json;
                } else if (json.data) {
                    episodios = Array.isArray(json.data) ? json.data : (json.data.episodes || json.data.eps || json.data.list);
                } else if (json.episodes) {
                    episodios = json.episodes;
                } else if (json.eps) {
                    episodios = json.eps;
                }

                if (!episodios || !Array.isArray(episodios) || episodios.length === 0) {
                    epList.innerHTML = '<div class="loading">Nenhum episódio disponível para este anime.</div>';
                    return;
                }

                epList.innerHTML = '';
                episodios.forEach((ep, idx) => {
                    let btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    if (idx === 0) btn.classList.add('active');
                    btn.innerText = `Ep ${ep.number || ep.episodeNumber || ep.ep || (idx + 1)}`;
                    
                    let epId = ep.episodeId || ep.id || ep.episode_id;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        carregarLinksEpisodio(epId);
                    };
                    epList.appendChild(btn);
                });

                let primeiroEp = episodios[0];
                let primeiroEpId = primeiroEp.episodeId || primeiroEp.id || primeiroEp.episode_id;
                if (primeiroEpId) {
                    carregarLinksEpisodio(primeiroEpId);
                }

            } catch (e) {
                epList.innerHTML = '<div class="loading">Erro ao carregar os episódios.</div>';
                console.error(e);
            }
        }

        async function carregarLinksEpisodio(epId) {
            try {
                let resposta = await fetch(`${API_URL}/episodes/${epId}/sources`);
                let dados = await resposta.json();
                let sourceUrl = dados.data?.sources?.[0]?.url || dados.sources?.[0]?.url || dados.url;
                
                if (sourceUrl) {
                    reproduzirVideo(sourceUrl);
                }
            } catch (e) {
                console.log("Erro ao obter link do stream");
            }
        }

        function reproduzirVideo(urlStream) {
            if (!urlStream) return;
            let video = document.getElementById('videoPlayer');
            video.pause();
            
            if (urlStream.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.currentHls) window.currentHls.destroy();
                    const hls = new Hls();
                    window.currentHls = hls;
                    hls.loadSource(urlStream);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(err => console.log(err));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = urlStream;
                    video.play().catch(err => console.log(err));
                }
            } else {
                video.src = urlStream;
                video.play().catch(err => console.log(err));
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') pesquisarAnime();
        }

        function voltarCatalogo() {
            document.getElementById('watch-section').style.display = 'none';
            let query = document.getElementById('searchInput').value.trim();
            if (query) {
                document.getElementById('search-results-section').style.display = 'block';
            } else {
                document.getElementById('catalog-section').style.display = 'block';
            }
            let video = document.getElementById('videoPlayer');
            video.pause();
            video.src = "";
            if (window.currentHls) window.currentHls.destroy();
        }

        carregarHome();
    </script>
</body>
</html>
